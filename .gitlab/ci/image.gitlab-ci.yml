# Builds the backend image (see Dockerfile) and pushes it to this project's container registry:
#   <registry>/<this project>:<branch>   on every branch
#   <registry>/<this project>:latest     additionally on the default branch
# Other projects use this image instead of building the backend themselves: the frontend for its e2e tests and
# the deployment examples in controlpage-releases.
#
# The runner mounts the host's Docker socket into the job, so the image is built by the host's Docker daemon
# (no Docker-in-Docker service). Its layer cache and the Maven cache of the Dockerfile persist between builds.
image:
  # runs after the test stage: an image is only published if the tests pass
  stage: publish
  image: docker:27
  # the global before_script checks java, which this image does not have
  before_script: []
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull -t "$IMAGE" .
    - docker push "$IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'
