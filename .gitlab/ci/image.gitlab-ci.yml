# Docker image of the backend (see Dockerfile).
#
# - default branch: publish-image builds it and pushes <registry>/<this project>:latest. Other projects use that
#   image instead of building the backend themselves: the frontend for its e2e tests and the deployment examples in
#   controlpage-releases.
# - other branches: build-image only builds it, so a broken image build fails before the merge. Nothing is pushed:
#   branch images would stay in the registry for good.
#
# Both run after the test stage, so an image is only published if the tests pass.
# The runner mounts the host's Docker socket into the job, so the image is built by the host's Docker daemon
# (no Docker-in-Docker service). Its layer cache and the Maven cache of the Dockerfile persist between builds.
# (no job is called "image": at the top level that is the keyword for the global default image)
.docker-image:
  stage: publish
  image: docker:27
  # the global before_script checks java, which this image does not have
  before_script: []

publish-image:
  extends: .docker-image
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-image:
  extends: .docker-image
  variables:
    # a tag of its own: the Docker daemon is shared with other jobs
    IMAGE: "controlpage-backend:ci-job-$CI_JOB_ID"
  script:
    - docker build --pull -t "$IMAGE" .
    - docker image rm "$IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
