version: '3'

# Database for local development. User, password and database match the defaults in application.yml,
# so the backend can connect to it without any configuration.
services:
  db:
    image: postgres:17
    hostname: postgres-controlpage
    container_name: controlpage_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=controlpage
      - POSTGRES_USER=ControlPageUser
      - POSTGRES_PASSWORD=6xovUH2QmUZooPTyYrpD9Js8fZRrMBrkqHzs4soRdP
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    hostname: postgres-controlpage-adminer
    container_name: controlpage_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  postgres_data:
